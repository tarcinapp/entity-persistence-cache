# ==============================================================================
# entity-persistence-cache — application.properties
#
# All keys can be overridden via environment variables using MicroProfile Config:
#   property.key  →  PROPERTY_KEY  (dots and hyphens become underscores, upper-cased)
#
# Examples:
#   backend.base-url      →  BACKEND_BASE_URL
#   epc.lock.wait-time    →  EPC_LOCK_WAIT_TIME
# ==============================================================================

# ------------------------------------------------------------------------------
# Quarkus HTTP server
# EPC listens on 3001 — sits between the orchestrator (:8079) and EPS (:3000)
# ------------------------------------------------------------------------------
quarkus.http.port=3001

# Override via: QUARKUS_HTTP_PORT

# ------------------------------------------------------------------------------
# Backend target — entity-persistence-service
#
# EPC and EPS share the same pod, so the loopback address is used.
# It must NOT have a trailing slash.
# ------------------------------------------------------------------------------
backend.base-url=http://localhost:3000
backend.system-info-path=/system-info

# Override via environment variables:
# backend.base-url=${BACKEND_BASE_URL:http://localhost:3000}
# backend.system-info-path=${BACKEND_SYSTEM_INFO_PATH:/system-info}

# ------------------------------------------------------------------------------
# Backend reachability check (startup)
# ------------------------------------------------------------------------------
backend.health-check.enabled=true
backend.health-check.path=/ping
backend.health-check.openapi-path=/openapi.json
backend.health-check.timeout-seconds=10

# Override via:
#   BACKEND_HEALTH_CHECK_ENABLED
#   BACKEND_HEALTH_CHECK_PATH
#   BACKEND_HEALTH_CHECK_TIMEOUT_SECONDS

# ------------------------------------------------------------------------------
# EPS REST client — used by ConfigCacheService to fetch /system-info
# ------------------------------------------------------------------------------
quarkus.rest-client."entity-persistence-service".url=${BACKEND_BASE_URL:${backend.base-url}}
quarkus.rest-client."entity-persistence-service".scope=jakarta.inject.Singleton
quarkus.rest-client."entity-persistence-service".connect-timeout=5000
quarkus.rest-client."entity-persistence-service".read-timeout=10000

# ------------------------------------------------------------------------------
# EPC application shortcode
#
# Fallback shortcode used when the X-App-Shortcode header is absent
# (e.g. direct calls without the gateway). The header takes precedence.
# ------------------------------------------------------------------------------
epc.app-shortcode=tarcinapp

# Override via: EPC_APP_SHORTCODE

# ------------------------------------------------------------------------------
# EPC config cache — /system-info in-process TTL
# ------------------------------------------------------------------------------
epc.config-cache.ttl-seconds=10

# Override via: EPC_CONFIG_CACHE_TTL_SECONDS

# ------------------------------------------------------------------------------
# EPC distributed locking
#
# wait-time  — max duration to wait for a lock before returning 423 Locked.
# lease-time — Redis TTL on the lock key; auto-expires if EPC crashes mid-flight.
# ------------------------------------------------------------------------------
epc.lock.wait-time=3000
epc.lock.lease-time=30000

# Override via:
#   EPC_LOCK_WAIT_TIME    (milliseconds)
#   EPC_LOCK_LEASE_TIME   (milliseconds)

# ------------------------------------------------------------------------------
# EPC findById response cache (Phase 2 master switch — off for Phase 1)
# When false, all GET caching is disabled; locks still operate normally.
# ------------------------------------------------------------------------------
epc.cache.enabled=false
epc.cache.default-ttl=60000

# Override via:
#   EPC_CACHE_ENABLED
#   EPC_CACHE_DEFAULT_TTL  (milliseconds)

# ------------------------------------------------------------------------------
# Redis connection
#
# Single-node default. Sentinel config is supplied at deployment time via
# environment variables without changing application source files.
# Use rediss:// scheme for TLS. Include password as: rediss://:password@host:port
# ------------------------------------------------------------------------------
quarkus.redis.hosts=redis://localhost:6379

# Override via: QUARKUS_REDIS_HOSTS

# ------------------------------------------------------------------------------
# Apache Camel
# ------------------------------------------------------------------------------
camel.context.name=entity-persistence-cache

# Camel HTTP component — timeouts for backend calls (ms)
camel.component.http.connection-time-to-live=60000
camel.component.http.so-timeout=30000
camel.component.http.connect-timeout=5000

# ------------------------------------------------------------------------------
# OpenTelemetry — distributed tracing
# ------------------------------------------------------------------------------
quarkus.otel.sdk.disabled=false
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.propagators=tracecontext,baggage
quarkus.otel.resource.attributes=service.name=entity-persistence-cache

# Override via: OTEL_EXPORTER_OTLP_ENDPOINT

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.apache.camel".level=INFO
quarkus.log.category."io.tarcinapp".level=DEBUG

# ------------------------------------------------------------------------------
# Dev-mode overrides (%dev profile)
# ------------------------------------------------------------------------------
%dev.quarkus.log.level=INFO
%dev.backend.base-url=http://localhost:3000
%dev.quarkus.otel.sdk.disabled=true
%dev.quarkus.observability.lgtm.enabled=false
%dev.quarkus.observability.devservices.enabled=false
%dev.backend.health-check.enabled=false
%dev.quarkus.live-reload.port=8181

# ------------------------------------------------------------------------------
# Test-mode overrides (%test profile)
# ------------------------------------------------------------------------------
%test.quarkus.otel.sdk.disabled=true
%test.backend.base-url=http://localhost:3000
%test.backend.health-check.enabled=false
%test.quarkus.redis.devservices.enabled=false
